<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./#Style.css" rel="stylesheet">
    <style>

body{
    background-color: rgba(185, 220, 185, 0.779);
    
}

h1{
      position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 60px;
  text-align: center;
}
header{ 
  position: sticky;
  top: 0px;
  background-color: rgba(255, 255, 255, 0.713);
  padding: 30px;
  margin: 20px;
  display: flex;
  justify-content: space-between;
  width: calc(100% - 40px);
  box-sizing: border-box;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}
.banner {
    aspect-ratio: 21/9;
}
img { width: 100%;
    height: 100%;
    object-fit: cover;
}
.Products {
    display: flex;
     justify-content:center ;
     gap: 80px;
     padding: 80px 0px;
     border: 30px white;
}

.card {
padding: 20px;
border-radius: 10px;
background-color: azure;
box-shadow: 4px 6px 30px black;
display: flex;
}
footer {
    height: 120px;
    background-color: rgba(185, 220, 185, 0.779);
}
.Container {
    max-width: 300px;
    width: 100%;
    border: 1px black;
    aspect-ratio: 16/9;
    border-radius: 6px;
    overflow: hidden;
}
main{ display: flex;
justify-content: center;}
button {
    background-color: blueviolet;
    color: aqua;
    border-radius: 6px;
    border: none;
    padding: 10px 20px;
}
section {
    margin: 20px;
    padding: 20px;
}
    </style>
</head>
<h1>
    Fahrräder
</h1>
<body>
    <header>
        <nav>
            <a href="Abaut.html">Abaut</a>
        </nav>
    </header>
        <section class="banner">
            <img src="Bachgroung.jpg" alt="">
        </section>
        <main id="#Produkts">
        <section class="Produkts">
            <article class="cards">
                <div class="Container">
                    <img src="1.jpg">
                </div>
                <h2>
                    Alltags Fahrräder
                </h2>
                <p>
                    Ideal zum pendeln
                </p>
                <button>
                    Kaufen
                </button>
            </article>
        </section>
        <section class="banner">
                       <article class="cards">
                <div class="Container">
                    <img src="2.jpg">
                </div>
                <h2>
                    Tandems
                </h2>
                <p>
                    Perfekt für ein picknik am See
                </p>
                <button>
                    Kaufen
                </button>
            </article>
            </section>
            <section class="banner">
                       <article class="cards">
                <div class="Container">
                    <img src="3.jpg">
                </div>
                <h2>
                    Lastenräder
                </h2>
                <p>
                    Ein schwerer Einkauf?   
                    Kein Problem!
                </p>
                <button>
                    Kaufen
                </button>
            </article>
        </section>
    </main>
    <footer id="footer">
        <p>
        Hier ist das Ende der Webiste
        </p>
    </footer>
</body>
</html>
